<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Browser Bridge</title>
    <link rel="stylesheet" href="assets/ui.css" />
  </head>
  <body class="bb-page bb-page--popup">
    <main class="bb-popup" role="main">
      <header class="bb-popup-head">
        <img
          class="bb-popup-icon"
          src="assets/icons/icon-32.png"
          width="18"
          height="18"
          alt=""
        />
        <h1 class="bb-popup-title">Browser Bridge</h1>
      </header>

      <div class="bb-menu" aria-label="Extension menu">
        <!-- Fallback for when dist scripts fail to load: don't navigate inside the popup. -->
        <a class="bb-row" id="bb-settings" href="options.html" target="_blank"
          >Settings</a
        >
        <a
          class="bb-row"
          id="bb-about"
          href="https://github.com/btraut/browser-bridge"
          target="_blank"
          rel="noopener noreferrer"
        >
          About
          <svg
            class="bb-row-icon"
            viewBox="0 0 20 20"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <path
              d="M8 4H5.5A1.5 1.5 0 0 0 4 5.5v9A1.5 1.5 0 0 0 5.5 16h9A1.5 1.5 0 0 0 16 14.5V12"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M11 4h5v5"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M10 10L16 4"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </a>
      </div>
    </main>

    <script type="module" src="dist/popup-ui.js"></script>
  </body>
</html>
