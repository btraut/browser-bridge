name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install deps
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Package extension zip
        run: |
          command -v zip >/dev/null || (sudo apt-get update && sudo apt-get install -y zip)
          node scripts/package-extension.mjs

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: browser-bridge-extension-${{ github.sha }}
          path: dist/browser-bridge-extension-*.zip
