name: Release Extension Asset

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag (for example, v0.4.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-extension-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build extension
        run: node scripts/build-extension.mjs

      - name: Package extension zip
        env:
          EXTENSION_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          command -v zip >/dev/null || (sudo apt-get update && sudo apt-get install -y zip)
          node scripts/package-extension.mjs

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag }}
          files: dist/browser-bridge-extension-${{ github.event.release.tag_name || inputs.tag }}.zip
