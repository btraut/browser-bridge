name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install deps
        run: npm ci

      - name: Verify tag matches package.json
        run: |
          node -e "const v=require('./package.json').version; const tag=process.env.GITHUB_REF_NAME; if (tag !== ('v' + v)) { throw new Error('Tag ' + tag + ' does not match package.json v' + v); }"

      - name: Package extension zip
        run: |
          mkdir -p dist
          node scripts/package-extension.mjs

      - name: Create release + upload assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/browser-bridge-extension-v*.zip
